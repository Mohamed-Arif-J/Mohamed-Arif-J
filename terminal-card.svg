      <text x="270" y="194"><tspan fill="#8b8fa3">Stack</tspan><tspan dx="10" fill="#e6e6e6">Python · React · Flutter · Django</tspan></text>
      <text x="270" y="218"><tspan fill="#8b8fa3">Focus</tspan><tspan dx="10" fill="#e6e6e6">CV · NLP · Local LLMs</tspan></text>
      <text x="270" y="242"><tspan fill="#8b8fa3">Locale</tspan><tspan dx="10" fill="#e6e6e6">Kerala, India</tspan></text>

