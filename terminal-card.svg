    <rect x="0" y="0" width="760" height="34" fill="#1a1f2b"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text x="380" y="22" fill="#8b8fa3" font-size="13" text-anchor="middle">arif@dev-machine: ~</text>

    <!-- geometric avatar: rotating abstract polygon rings, no likeness of any person -->
    <g transform="translate(140,205)">
      <circle r="88" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.35"/>
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="#a78bfa" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="12s" repeatCount="indefinite"/>
      </polygon>
      <circle r="14" fill="#a78bfa">
        <animate attributeName="r" values="12;16;12" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-size="15">
